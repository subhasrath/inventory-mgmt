<div class="flex min-h-screen items-center justify-center bg-gray-50 dark:bg-gray-900">
      <div class="w-full max-w-md space-y-6 rounded-lg bg-white p-8 shadow dark:bg-gray-800">
        <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Create Admin Account</h2>
        <p class="text-sm text-gray-500 dark:text-gray-400">First user becomes the administrator.</p>

        <div>
          <label class="mb-2 block text-sm font-medium text-gray-900 dark:text-white">Full Name</label>
          <input [(ngModel)]="fullName" type="text" class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 text-gray-900 focus:border-blue-500 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white" placeholder="Subhas" />
        </div>

        <div>
          <label class="mb-2 block text-sm font-medium text-gray-900 dark:text-white">Username</label>
          <input [(ngModel)]="username" type="text" class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 text-gray-900 focus:border-blue-500 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white" placeholder="subhas" />
        </div>

        <div>
          <label class="mb-2 block text-sm font-medium text-gray-900 dark:text-white">Password</label>
          <input [(ngModel)]="password" type="password" class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 text-gray-900 focus:border-blue-500 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white" placeholder="••••••••" />
        </div>

        <div>
          <label class="mb-2 block text-sm font-medium text-gray-900 dark:text-white">Confirm Password</label>
          <input [(ngModel)]="confirmPassword" type="password" class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 text-gray-900 focus:border-blue-500 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white" placeholder="••••••••" />
        </div>

        <button (click)="doSignup()" [disabled]="loading" class="w-full rounded-lg bg-blue-700 px-5 py-2.5 text-center text-sm font-medium text-white hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 disabled:opacity-50 dark:bg-blue-600 dark:hover:bg-blue-700">
          {{ loading ? 'Creating...' : 'Create Account' }}
        </button>

        <p *ngIf="error" class="text-sm text-red-600 dark:text-red-400">{{ error }}</p>

        <p class="text-sm text-gray-500 dark:text-gray-400">
          Already have an account? <a routerLink="/login" class="text-blue-600 hover:underline dark:text-blue-500">Sign in</a>
        </p>
      </div>
    </div>
