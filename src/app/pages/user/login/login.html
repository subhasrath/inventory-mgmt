<div class="flex min-h-screen items-center justify-center bg-gray-50 dark:bg-gray-900 px-4">
  <div class="w-full max-w-md space-y-6 rounded-lg bg-white p-8 shadow dark:bg-gray-800">

    <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Sign in</h2>

    <form #loginForm="ngForm" (ngSubmit)="doLogin()" novalidate class="space-y-6">

      <!-- Username -->
      <div>
        <label for="login-username" class="mb-2 block text-sm font-medium text-gray-900 dark:text-white">
          Username
        </label>
        <input
          id="login-username"
          name="username"
          [(ngModel)]="username"
          type="text"
          autocomplete="username"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          required
          [disabled]="loading"
          [attr.aria-invalid]="!!error"
          aria-describedby="login-error"
          class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 text-gray-900 focus:border-blue-500 focus:ring-blue-500 disabled:opacity-60 dark:border-gray-600 dark:bg-gray-700 dark:text-white"
          placeholder="subhas" />
      </div>

      <!-- Password -->
      <div>
        <label for="login-password" class="mb-2 block text-sm font-medium text-gray-900 dark:text-white">
          Password
        </label>
        <div class="relative">
          <input
            id="login-password"
            name="password"
            [(ngModel)]="password"
            [type]="showPassword ? 'text' : 'password'"
            autocomplete="current-password"
            required
            [disabled]="loading"
            [attr.aria-invalid]="!!error"
            aria-describedby="login-error"
            (focus)="selectAll($event)"
            class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 pr-12 text-gray-900 focus:border-blue-500 focus:ring-blue-500 disabled:opacity-60 dark:border-gray-600 dark:bg-gray-700 dark:text-white"
            placeholder="••••••••" />
          <button
            type="button"
            (click)="togglePassword()"
            [disabled]="loading"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="showPassword"
            class="absolute inset-y-0 right-0 flex items-center px-3 text-xs font-medium text-gray-500 hover:text-gray-700 disabled:opacity-50 dark:text-gray-400 dark:hover:text-gray-200">
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
      </div>

      <!-- Error -->
      <p
  *ngIf="error"
  role="status"
  aria-live="polite"
  class="text-sm"
  [class.text-red-600]="noticeType === 'error'"
  [class.text-green-600]="noticeType === 'success'"
  [class.text-blue-600]="noticeType === 'info'"
  [class.dark:text-red-400]="noticeType === 'error'"
  [class.dark:text-green-400]="noticeType === 'success'"
  [class.dark:text-blue-400]="noticeType === 'info'">
  {{ error }}
</p>

      <!-- Submit -->
      <button
        type="submit"
        [disabled]="!canSubmit"
        class="w-full rounded-lg bg-blue-700 px-5 py-2.5 text-center text-sm font-medium text-white hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 disabled:opacity-50 disabled:cursor-not-allowed dark:bg-blue-600 dark:hover:bg-blue-700">
        {{ loading ? 'Signing in…' : 'Sign In' }}
      </button>
    </form>

    <div class="flex justify-between text-sm">
      <a routerLink="/signup" class="text-blue-600 hover:underline dark:text-blue-500">Create account</a>
      <a routerLink="/forgot-password" class="text-gray-500 hover:underline dark:text-gray-400">Forgot password?</a>
    </div>
  </div>
</div>
