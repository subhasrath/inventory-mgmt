<div class="min-h-screen bg-gray-50 dark:bg-gray-900 p-6">
      <div class="mx-auto max-w-3xl">

        <div class="mb-6 flex items-center justify-between">
          <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Shop / Company Details</h1>
          <a routerLink="/dashboard" class="text-sm text-blue-600 hover:underline dark:text-blue-400">
            ← Back to dashboard
          </a>
        </div>

        <div class="rounded-lg bg-white p-6 shadow dark:bg-gray-800">
          <p class="mb-6 text-sm text-gray-500 dark:text-gray-400">
            These details appear on every GST invoice. Fields marked <span class="text-red-500">*</span> are required.
          </p>

          <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">

            <div class="sm:col-span-2">
              <label class="mb-2 block text-sm font-medium text-gray-900 dark:text-white">Shop Name <span class="text-red-500">*</span></label>
              <input [(ngModel)]="company.name" class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 dark:border-gray-600 dark:bg-gray-700 dark:text-white" />
            </div>

            <div class="sm:col-span-2">
              <label class="mb-2 block text-sm font-medium text-gray-900 dark:text-white">GSTIN <span class="text-red-500">*</span></label>
              <input [(ngModel)]="company.gstin" placeholder="27ABCDE1234F1Z5" class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 dark:border-gray-600 dark:bg-gray-700 dark:text-white" />
            </div>

            <div class="sm:col-span-2">
              <label class="mb-2 block text-sm font-medium text-gray-900 dark:text-white">Address</label>
              <input [(ngModel)]="company.address" class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 dark:border-gray-600 dark:bg-gray-700 dark:text-white" />
            </div>

            <div>
              <label class="mb-2 block text-sm font-medium text-gray-900 dark:text-white">City</label>
              <input [(ngModel)]="company.city" class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 dark:border-gray-600 dark:bg-gray-700 dark:text-white" />
            </div>

            <div>
              <label class="mb-2 block text-sm font-medium text-gray-900 dark:text-white">State <span class="text-red-500">*</span></label>
              <input [(ngModel)]="company.state" placeholder="Maharashtra" class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 dark:border-gray-600 dark:bg-gray-700 dark:text-white" />
            </div>

            <div>
              <label class="mb-2 block text-sm font-medium text-gray-900 dark:text-white">Pincode</label>
              <input [(ngModel)]="company.pincode" class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 dark:border-gray-600 dark:bg-gray-700 dark:text-white" />
            </div>

            <div>
              <label class="mb-2 block text-sm font-medium text-gray-900 dark:text-white">Phone</label>
              <input [(ngModel)]="company.phone" class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 dark:border-gray-600 dark:bg-gray-700 dark:text-white" />
            </div>

            <div class="sm:col-span-2">
              <label class="mb-2 block text-sm font-medium text-gray-900 dark:text-white">Email</label>
              <input [(ngModel)]="company.email" type="email" class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 dark:border-gray-600 dark:bg-gray-700 dark:text-white" />
            </div>

            <div>
              <label class="mb-2 block text-sm font-medium text-gray-900 dark:text-white">Invoice Prefix</label>
              <input [(ngModel)]="company.invoicePrefix" placeholder="INV" class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 dark:border-gray-600 dark:bg-gray-700 dark:text-white" />
            </div>

            <div>
              <label class="mb-2 block text-sm font-medium text-gray-900 dark:text-white">Next Invoice No</label>
              <input [(ngModel)]="company.nextInvoiceNo" type="number" class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 dark:border-gray-600 dark:bg-gray-700 dark:text-white" />
            </div>
          </div>

          <div class="mt-6 flex items-center gap-3">
            <button
              (click)="save()"
              [disabled]="saving"
              class="rounded-lg bg-blue-700 px-5 py-2.5 text-sm font-medium text-white hover:bg-blue-800 disabled:opacity-50 dark:bg-blue-600 dark:hover:bg-blue-700">
              {{ saving ? 'Saving...' : 'Save Details' }}
            </button>
            <span *ngIf="message" class="text-sm" [class.text-green-600]="success" [class.text-red-600]="!success">{{ message }}</span>
          </div>
        </div>
      </div>
    </div>
