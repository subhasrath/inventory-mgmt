    <div class="min-h-screen bg-gray-50 dark:bg-gray-900 p-6">
      <div class="mx-auto max-w-5xl">

        <div class="mb-6 flex items-center justify-between">
          <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Vendor / Supplier Master</h1>
          <a routerLink="/dashboard" class="text-sm text-blue-600 hover:underline dark:text-blue-400">← Dashboard</a>
        </div>

        <div class="mb-6 rounded-lg bg-white p-6 shadow dark:bg-gray-800">
          <h2 class="mb-4 text-lg font-semibold text-gray-900 dark:text-white">
            {{ editing ? 'Edit Vendor' : 'Add Vendor' }}
          </h2>

          <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
            <div>
              <label class="mb-1 block text-xs font-medium text-gray-700 dark:text-gray-300">Full Name *</label>
              <input [(ngModel)]="form.fullName" class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2 text-sm dark:border-gray-600 dark:bg-gray-700 dark:text-white" />
            </div>
            <div>
              <label class="mb-1 block text-xs font-medium text-gray-700 dark:text-gray-300">GSTIN</label>
              <input [(ngModel)]="form.gstin" class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2 text-sm dark:border-gray-600 dark:bg-gray-700 dark:text-white" />
            </div>
            <div>
              <label class="mb-1 block text-xs font-medium text-gray-700 dark:text-gray-300">Mobile *</label>
              <input [(ngModel)]="form.mobile" class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2 text-sm dark:border-gray-600 dark:bg-gray-700 dark:text-white" />
            </div>
            <div>
              <label class="mb-1 block text-xs font-medium text-gray-700 dark:text-gray-300">Alternate Phone</label>
              <input [(ngModel)]="form.phone2" class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2 text-sm dark:border-gray-600 dark:bg-gray-700 dark:text-white" />
            </div>
            <div class="sm:col-span-2">
              <label class="mb-1 block text-xs font-medium text-gray-700 dark:text-gray-300">Email</label>
              <input [(ngModel)]="form.email" type="email" class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2 text-sm dark:border-gray-600 dark:bg-gray-700 dark:text-white" />
            </div>
            <div class="sm:col-span-2">
              <label class="mb-1 block text-xs font-medium text-gray-700 dark:text-gray-300">Address *</label>
              <input [(ngModel)]="form.address" class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2 text-sm dark:border-gray-600 dark:bg-gray-700 dark:text-white" />
            </div>
            <div>
              <label class="mb-1 block text-xs font-medium text-gray-700 dark:text-gray-300">City</label>
              <input [(ngModel)]="form.city" class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2 text-sm dark:border-gray-600 dark:bg-gray-700 dark:text-white" />
            </div>
            <div>
              <label class="mb-1 block text-xs font-medium text-gray-700 dark:text-gray-300">District</label>
              <input [(ngModel)]="form.district" class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2 text-sm dark:border-gray-600 dark:bg-gray-700 dark:text-white" />
            </div>
            <div>
              <label class="mb-1 block text-xs font-medium text-gray-700 dark:text-gray-300">State *</label>
              <input [(ngModel)]="form.state" placeholder="Maharashtra" class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2 text-sm dark:border-gray-600 dark:bg-gray-700 dark:text-white" />
            </div>
            <div>
              <label class="mb-1 block text-xs font-medium text-gray-700 dark:text-gray-300">Pincode</label>
              <input [(ngModel)]="form.pincode" class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2 text-sm dark:border-gray-600 dark:bg-gray-700 dark:text-white" />
            </div>
          </div>

          <div class="mt-4 flex items-center gap-3">
            <button (click)="save()" [disabled]="saving"
                    class="rounded-lg bg-blue-700 px-4 py-2 text-sm font-medium text-white hover:bg-blue-800 disabled:opacity-50 dark:bg-blue-600">
              {{ saving ? 'Saving...' : (editing ? 'Update' : 'Add Vendor') }}
            </button>
            <button *ngIf="editing" (click)="cancel()" class="rounded-lg border border-gray-300 px-4 py-2 text-sm dark:border-gray-600 dark:text-gray-200">Cancel</button>
            <span *ngIf="message" class="text-sm" [class.text-green-600]="success" [class.text-red-600]="!success">{{ message }}</span>
          </div>
        </div>

        <div class="rounded-lg bg-white p-6 shadow dark:bg-gray-800">
          <h2 class="mb-4 text-lg font-semibold text-gray-900 dark:text-white">Vendors ({{ vendors.length }})</h2>

          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="border-b border-gray-200 dark:border-gray-700">
                <tr class="text-left text-xs font-medium text-gray-500 dark:text-gray-400">
                  <th class="pb-2">Name</th>
                  <th class="pb-2">GSTIN</th>
                  <th class="pb-2">Mobile</th>
                  <th class="pb-2">State</th>
                  <th class="pb-2">Status</th>
                  <th class="pb-2"></th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let v of vendors" class="border-b border-gray-100 dark:border-gray-700">
                  <td class="py-2">{{ v.fullName }}</td>
                  <td class="py-2 font-mono text-xs">{{ v.gstin || '—' }}</td>
                  <td class="py-2">{{ v.mobile }}</td>
                  <td class="py-2">{{ v.state }}</td>
                  <td class="py-2">{{ v.status }}</td>
                  <td class="py-2 text-right">
                    <button (click)="edit(v)" class="mr-2 text-xs text-blue-600 hover:underline dark:text-blue-400">Edit</button>
                    <button (click)="deactivate(v)" *ngIf="v.status === 'Active'" class="text-xs text-red-600 hover:underline dark:text-red-400">Deactivate</button>
                  </td>
                </tr>
                <tr *ngIf="vendors.length === 0"><td colspan="6" class="py-6 text-center text-gray-500">No vendors yet.</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
