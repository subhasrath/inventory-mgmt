<div class="flex min-h-screen items-center justify-center bg-gray-50 dark:bg-gray-900">
      <div class="w-full max-w-md space-y-6 rounded-lg bg-white p-8 shadow dark:bg-gray-800">
        <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Sign in</h2>

        <div>
          <label class="mb-2 block text-sm font-medium text-gray-900 dark:text-white">Username</label>
          <input [(ngModel)]="username" type="text" class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 text-gray-900 focus:border-blue-500 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white" placeholder="subhas" />
        </div>

        <div>
          <label class="mb-2 block text-sm font-medium text-gray-900 dark:text-white">Password</label>
          <input [(ngModel)]="password" type="password" class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 text-gray-900 focus:border-blue-500 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white" placeholder="••••••••" />
        </div>

        <button (click)="doLogin()" [disabled]="loading" class="w-full rounded-lg bg-blue-700 px-5 py-2.5 text-center text-sm font-medium text-white hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 disabled:opacity-50 dark:bg-blue-600 dark:hover:bg-blue-700">
          {{ loading ? 'Signing in...' : 'Sign In' }}
        </button>

        <p *ngIf="error" class="text-sm text-red-600 dark:text-red-400">{{ error }}</p>

        <div class="flex justify-between text-sm">
          <a routerLink="/signup" class="text-blue-600 hover:underline dark:text-blue-500">Create account</a>
          <a routerLink="/forgot-password" class="text-gray-500 hover:underline dark:text-gray-400">Forgot password?</a>
        </div>
      </div>
    </div>
